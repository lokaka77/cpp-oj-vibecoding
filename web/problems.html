<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeHunter - 题目列表</title>
    <meta name="theme-color" content="#070a0f">
    <link rel="stylesheet" href="./css/style.css?v=6">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230b1118'/%3E%3Cpath d='M20 44 32 20l12 24' stroke='%2326d0ce' stroke-width='5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
</head>
<body class="app-page">
    <canvas id="tech-canvas" aria-hidden="true"></canvas>

    <div class="app-shell">
        <header class="app-header">
            <a class="app-brand" href="./problems.html" aria-label="CodeHunter 首页">
                <span class="brand-mark brand-mark-small" aria-hidden="true">C++</span>
                <span class="app-brand-name">CodeHunter</span>
            </a>

            <nav class="app-nav" aria-label="主导航">
                <a class="app-nav-link is-active" href="./problems.html">题库</a>
                <a id="admin-nav-link" class="app-nav-link" href="./admin.html" hidden>管理</a>
                <a id="admin-users-nav-link" class="app-nav-link" href="./admin-users.html" hidden>用户</a>
            </nav>

            <div class="app-user">
                <span id="user-role" class="role-badge" hidden></span>
                <span id="user-name" class="user-name" hidden></span>
                <a id="login-link" class="ghost-button" href="./login.html" hidden>
                    登录 / 注册
                </a>
                <button id="logout-button" class="ghost-button" type="button" hidden>
                    退出
                </button>
            </div>
        </header>

        <main class="page-content">
            <header class="page-heading">
                <div>
                    <p class="eyebrow">PROBLEM SET</p>
                    <h1>题目列表</h1>
                </div>
                <p id="problem-count" class="problem-count">共 0 道题</p>
            </header>

            <section class="toolbar" aria-label="题目筛选">
                <label class="search-box" for="problem-search">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <circle cx="11" cy="11" r="6"></circle>
                        <path d="m16 16 4 4"></path>
                    </svg>
                    <input id="problem-search"
                           type="search"
                           placeholder="搜索题目"
                           autocomplete="off">
                </label>
            </section>

            <section class="problem-panel" aria-live="polite">
                <div id="loading-state" class="loading-state">
                    <div class="skeleton-row"></div>
                    <div class="skeleton-row"></div>
                    <div class="skeleton-row"></div>
                </div>

                <div id="problem-list" class="problem-list" role="list" hidden>
                    <div class="problem-list-header" aria-hidden="true">
                        <span>编号</span>
                        <span>题目</span>
                        <span>状态</span>
                        <span>操作</span>
                    </div>
                    <div id="problem-items"></div>
                </div>

                <div id="empty-state" class="state-message" hidden>
                    <p>暂无题目</p>
                </div>

                <div id="error-state" class="state-message state-message-error" hidden>
                    <p id="error-message">题目加载失败</p>
                    <button id="retry-button" class="ghost-button" type="button">
                        重新加载
                    </button>
                </div>
            </section>
        </main>
    </div>

    <script src="./js/api.js?v=6" defer></script>
    <script src="./js/tech-background.js?v=6" defer></script>
    <script src="./js/problems.js?v=6" defer></script>
</body>
</html>
